<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Làm Bài Kiểm Tra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0f0e17;--surface:#1a1929;--surface2:#252440;--border:#2e2c50;
      --accent:#7c5cbf;--accent3:#43d9ad;--accent4:#ffd166;
      --text:#e8e6f0;--text-muted:#8884aa;--correct:#43d9ad;--wrong:#ff6b6b;
      --radius:16px;--radius-sm:10px;--shadow:0 8px 32px rgba(0,0,0,.4);
    }
    [data-theme="dark"] {
      --bg: #0f0e17; --surface: #1a1929; --surface2: #252440; --border: #2e2c50; --accent: #7c5cbf; --accent3: #43d9ad; --accent4: #ffd166; --text: #e8e6f0; --text-muted: #8884aa; --correct: #43d9ad; --wrong: #ff6b6b; --header-bg: linear-gradient(135deg, #1e1b3a 0%, #2d2060 50%, #1e1b3a 100%); --header-title: linear-gradient(135deg, #ffffff 0%, #c4b0f0 50%, #7c5cbf 100%);
    }
    [data-theme="light"] {
      --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9; --border: #e2e8f0; --accent: #3b82f6; --accent3: #10b981; --accent4: #f59e0b; --text: #1e293b; --text-muted: #64748b; --correct: #10b981; --wrong: #ef4444; --header-bg: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #eff6ff 100%); --header-title: linear-gradient(135deg, #1e293b 0%, #3b82f6 50%, #2563eb 100%);
    }
    [data-theme="ocean"] {
      --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #475569; --accent: #0ea5e9; --accent3: #14b8a6; --accent4: #fcd34d; --text: #f8fafc; --text-muted: #94a3b8; --correct: #14b8a6; --wrong: #f43f5e; --header-bg: linear-gradient(135deg, #0f172a 0%, #164e63 50%, #0f172a 100%); --header-title: linear-gradient(135deg, #ffffff 0%, #7dd3fc 50%, #0ea5e9 100%);
    }
    [data-theme="forest"] {
      --bg: #14532d; --surface: #166534; --surface2: #15803d; --border: #16a34a; --accent: #22c55e; --accent3: #4ade80; --accent4: #fef08a; --text: #f0fdf4; --text-muted: #86efac; --correct: #84cc16; --wrong: #ef4444; --header-bg: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #064e3b 100%); --header-title: linear-gradient(135deg, #ffffff 0%, #86efac 50%, #22c55e 100%);
    }
    [data-theme="sunset"] {
      --bg: #4c0519; --surface: #881337; --surface2: #9f1239; --border: #be123c; --accent: #fb7185; --accent3: #fcd34d; --accent4: #fbbf24; --text: #fff1f2; --text-muted: #fda4af; --correct: #34d399; --wrong: #f87171; --header-bg: linear-gradient(135deg, #4c0519 0%, #9f1239 50%, #4c0519 100%); --header-title: linear-gradient(135deg, #ffffff 0%, #fecdd3 50%, #fb7185 100%);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 80px;overflow-x:hidden}

    /* ── Header ── */
    .header{background:var(--header-bg,linear-gradient(135deg,#1e1b3a 0%,#2d2060 50%,#1e1b3a 100%));padding:28px 20px 50px;text-align:center;position:relative;overflow:hidden}
    .header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(124,92,191,.3) 0%,transparent 70%)}
    .back-btn{position:absolute;left:14px;top:20px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:100px;padding:7px 13px;color:var(--text-muted);font-size:12px;font-weight:700;text-decoration:none;transition:all .15s;z-index:2}
    .back-btn:hover{background:rgba(255,255,255,.14);color:var(--text)}
    .mode-badge{position:absolute;right:14px;top:20px;padding:5px 12px;border-radius:100px;font-size:11px;font-weight:800;z-index:2}
    .mode-badge.immediate{background:rgba(67,217,173,.18);border:1px solid rgba(67,217,173,.4);color:#43d9ad}
    .mode-badge.deferred{background:rgba(255,209,102,.15);border:1px solid rgba(255,209,102,.35);color:#ffd166}
    .exam-meta{position:relative;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
    .meta-badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:100px}
    .meta-subject{background:rgba(124,92,191,.25);border:1px solid rgba(124,92,191,.5);color:#c4b0f0}
    .meta-grade{background:rgba(67,217,173,.15);border:1px solid rgba(67,217,173,.3);color:#43d9ad}
    .header h1{font-size:clamp(18px,4vw,30px);font-weight:900;position:relative;background:var(--header-title,linear-gradient(135deg,#fff 0%,#c4b0f0 50%,#7c5cbf 100%));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

    /* ── Score bar ── */
    .score-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:-24px;position:relative;z-index:10;padding:0 16px;flex-wrap:wrap}
    .score-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 20px;text-align:center;box-shadow:var(--shadow);min-width:90px}
    .score-card .label{font-size:10px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
    .score-card .value{font-size:22px;font-weight:900;color:var(--accent4)}
    .score-card.deferred-card .value{color:var(--accent3);font-size:18px}
    .progress-wrap{max-width:820px;margin:18px auto 0;padding:0 16px}
    .progress-bar{height:5px;background:var(--border);border-radius:100px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent3));border-radius:100px;transition:width .3s ease;width:0}
    .progress-label{font-size:11px;color:var(--text-muted);font-weight:700;text-align:right;margin-top:4px}

    /* ── Cards ── */
    .quiz-container{max-width:820px;margin:22px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:20px}
    .q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
    .q-card:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
    .q-header{padding:14px 18px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .q-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5a3fa0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
    .q-type-badge{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:2px 9px;border-radius:100px}
    .badge-choice{background:rgba(124,92,191,.2);color:#c4b0f0;border:1px solid rgba(124,92,191,.4)}
    .badge-fill{background:rgba(255,209,102,.15);color:#ffd166;border:1px solid rgba(255,209,102,.35)}
    .badge-match{background:rgba(67,217,173,.15);color:#43d9ad;border:1px solid rgba(67,217,173,.35)}
    .badge-multi{background:rgba(255,107,107,.15);color:#ff9a9a;border:1px solid rgba(255,107,107,.3)}
    .q-text{padding:14px 18px 0;font-size:15px;font-weight:700;line-height:1.55;color:var(--text)}
    .q-body{padding:12px 18px 18px}

    /* ── Choice ── */
    .choices{display:flex;flex-direction:column;gap:7px;margin-top:6px}
    .choice-btn{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;color:var(--text);transition:all .15s;text-align:left;width:100%}
    .choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(124,92,191,.15);transform:translateX(3px)}
    .choice-btn.selected-deferred{border-color:var(--accent);background:rgba(124,92,191,.2);color:#c4b0f0}
    .choice-btn.correct{border-color:var(--correct);background:rgba(67,217,173,.15);color:var(--correct)}
    .choice-btn.wrong{border-color:var(--wrong);background:rgba(255,107,107,.15);color:var(--wrong)}
    .choice-letter{width:24px;height:24px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;transition:background .15s}
    .choice-btn.selected-deferred .choice-letter{background:var(--accent);color:#fff}
    .choice-btn.correct .choice-letter{background:var(--correct);color:#0f0e17}
    .choice-btn.wrong .choice-letter{background:var(--wrong);color:#fff}

    /* ── Multi ── */
    .multi-hint{font-size:11px;color:var(--text-muted);margin-bottom:7px;font-weight:600}
    .multi-btn{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;color:var(--text);transition:all .15s;text-align:left;width:100%}
    .multi-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(124,92,191,.15)}
    .multi-btn.selected{border-color:var(--accent);background:rgba(124,92,191,.2)}
    .multi-btn.correct{border-color:var(--correct);background:rgba(67,217,173,.15);color:var(--correct)}
    .multi-btn.wrong{border-color:var(--wrong);background:rgba(255,107,107,.15);color:var(--wrong)}
    .multi-btn.missed{border-color:var(--accent4);background:rgba(255,209,102,.12);color:var(--accent4)}
    .check-box{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
    .multi-btn.selected .check-box{border-color:var(--accent);background:var(--accent);color:#fff}
    .multi-btn.correct .check-box{border-color:var(--correct);background:var(--correct);color:#0f0e17}
    .multi-btn.wrong .check-box{border-color:var(--wrong);background:var(--wrong);color:#fff}
    .multi-btn.missed .check-box{border-color:var(--accent4);background:var(--accent4);color:#0f0e17}

    /* ── Fill ── */
    .fill-sentence{font-size:15px;font-weight:600;line-height:2.8;color:var(--text)}
    .fill-input{display:inline-block;border:none;border-bottom:2.5px solid var(--accent);background:transparent;color:var(--accent4);font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;text-align:center;width:70px;outline:none;padding:2px 4px;transition:border-color .15s;vertical-align:middle}
    .fill-input:focus{border-color:var(--accent4)}
    .fill-input.correct{border-color:var(--correct);color:var(--correct)}
    .fill-input.wrong{border-color:var(--wrong);color:var(--wrong)}

    /* ── Match ── */
    .match-hint{font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:9px;padding:5px 9px;background:rgba(124,92,191,.08);border-radius:7px;border-left:3px solid var(--accent)}
    .match-area{display:flex;gap:0;align-items:flex-start}
    .match-col{flex:1;display:flex;flex-direction:column;gap:7px}
    .match-svg-col{width:60px;flex-shrink:0;position:relative;align-self:stretch}
    .match-svg-col svg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .match-item{padding:9px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-size:12px;font-weight:700;text-align:center;transition:all .15s;user-select:none}
    .match-item.active-left{border-color:var(--accent3);background:rgba(67,217,173,.18);box-shadow:0 0 0 3px rgba(67,217,173,.2);transform:scale(1.03)}
    .match-item.paired{border-color:var(--accent);background:rgba(124,92,191,.18);color:#c4b0f0}
    .match-item.checked-correct{border-color:var(--correct);background:rgba(67,217,173,.12);color:var(--correct);cursor:default;pointer-events:none}
    .match-item.checked-wrong{border-color:var(--wrong);background:rgba(255,107,107,.12);color:var(--wrong);cursor:default;pointer-events:none}
    .match-item:hover:not(.active-left):not(.checked-correct):not(.checked-wrong){border-color:var(--accent3);transform:scale(1.02)}

    /* ── Feedback ── */
    .q-feedback{margin-top:9px;padding:7px 11px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;display:none;align-items:center;gap:6px}
    .q-feedback.show{display:flex}
    .q-feedback.correct-fb{background:rgba(67,217,173,.1);border:1px solid rgba(67,217,173,.3);color:var(--correct)}
    .q-feedback.wrong-fb{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:var(--wrong)}

    /* ── Buttons ── */
    .check-btn{margin-top:12px;padding:9px 22px;border-radius:100px;border:none;background:linear-gradient(135deg,var(--accent),#5a3fa0);color:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .18s}
    .check-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(124,92,191,.5)}
    .check-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
    .submit-section{max-width:820px;margin:14px auto 0;padding:0 16px;text-align:center}
    .submit-btn{padding:15px 44px;border-radius:100px;border:none;background:linear-gradient(135deg,#ff6b6b,#ee4266);color:#fff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;cursor:pointer;transition:all .2s;box-shadow:0 8px 24px rgba(255,107,107,.35)}
    .submit-btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(255,107,107,.5)}

    /* ── Result ── */
    .result-overlay{display:none;position:fixed;inset:0;background:rgba(10,9,22,.88);backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;padding:20px}
    .result-overlay.show{display:flex}
    .result-box{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:36px 40px;text-align:center;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
    @keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
    .result-emoji{font-size:52px;margin-bottom:10px;display:block}
    .result-title{font-size:22px;font-weight:900}
    .result-score{font-size:46px;font-weight:900;color:var(--accent4);margin:10px 0 4px}
    .result-msg{color:var(--text-muted);font-size:13px;font-weight:600;margin-bottom:18px}
    .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .retry-btn{padding:11px 26px;border-radius:100px;border:none;background:linear-gradient(135deg,var(--accent),#5a3fa0);color:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .18s}
    .retry-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(124,92,191,.5)}
    .home-btn{padding:11px 26px;border-radius:100px;border:1.5px solid var(--border);background:transparent;color:var(--text-muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .18s;text-decoration:none;display:inline-flex;align-items:center}
    .home-btn:hover{border-color:var(--accent);color:var(--text)}
    .review-btn{padding:11px 26px;border-radius:100px;border:1.5px solid var(--border);background:transparent;color:var(--text-muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center}
    .review-btn:hover{border-color:var(--accent);color:var(--text)}

    /* ── Empty ── */
    .empty-state{max-width:440px;margin:80px auto;text-align:center;padding:0 20px}
    .empty-emoji{font-size:60px;margin-bottom:18px}
    .empty-state h2{font-size:20px;font-weight:800;margin-bottom:8px}
    .empty-state p{color:var(--text-muted);font-size:14px;margin-bottom:22px}
    .go-home{display:inline-block;padding:13px 32px;border-radius:100px;background:linear-gradient(135deg,var(--accent),#5a3fa0);color:#fff;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;text-decoration:none;transition:all .2s}
    .go-home:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(124,92,191,.5)}

    /* ── Particles ── */
    .particles{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
    .particle{position:absolute;border-radius:50%;opacity:.05;animation:drift linear infinite}
    @keyframes drift{from{transform:translateY(100vh) rotate(0deg)}to{transform:translateY(-20vh) rotate(360deg)}}
    @keyframes drawLine{to{stroke-dashoffset:0}}

    /* ── Theme Selector ── */
    .theme-selector { position: absolute; top: 18px; right: 90px; z-index: 20; }
    @media(max-width:600px){ .theme-selector { right: 80px; } }
    .theme-select { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); color: var(--text); font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; cursor: pointer; outline: none; appearance: none; -webkit-appearance: none; padding-right: 24px; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2210%22%20height%3D%2210%22%20viewBox%3D%220%200%2024%2024%20%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M7%2010l5%205%205-5%22%20stroke%3D%22%238884aa%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 8px center; transition: all 0.2s; }
    .theme-select:hover { background-color: rgba(255, 255, 255, 0.15); }
    .theme-select option { background: var(--surface); color: var(--text); }

    /* ── Deferred mode indicator ── */
    .deferred-banner{max-width:820px;margin:16px auto 0;padding:0 16px}
    .deferred-banner-inner{background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.25);border-radius:var(--radius-sm);padding:10px 16px;font-size:12px;font-weight:700;color:var(--accent4);display:flex;align-items:center;gap:8px}

    /* ── Mobile ── */
    @media(max-width:600px){
      .score-bar{gap:8px}
      .score-card{padding:8px 14px;min-width:75px}
      .score-card .value{font-size:18px}
      .result-box{padding:28px 24px}
      .result-score{font-size:38px}
    }
  </style>
</head>
<body data-theme="dark">
<div class="particles" id="particles"></div>
<div id="app"></div>

<script>
// ─── State ──────────────────────────────────────────
var questions = [];
var quizMode = 'immediate'; // 'immediate' | 'deferred'
var appState = {
  score:0, done:0, answered:{},
  matchState:{},
  multiSelected:{},
  choiceSelected:{},  // for deferred mode
  interacted:{}       // for deferred mode progress tracking
};

// ─── Init ────────────────────────────────────────────
(function init(){
  spawnParticles();
  quizMode = localStorage.getItem('quizMode') || 'immediate';

  var raw = localStorage.getItem('currentExam');
  if(!raw){ renderEmpty(); return; }
  try{ questions = JSON.parse(raw); }catch(e){ renderEmpty(); return; }
  if(!questions || questions.length===0){ renderEmpty(); return; }

  questions.forEach(function(q){
    if(q.type==='match') appState.matchState[q.id]={selected:null,pairs:[],locked:false};
    if(q.type==='multi') appState.multiSelected[q.id]=[];
  });

  renderExam();
})();

// ─── Particles ───────────────────────────────────────
function spawnParticles(){
  var c=document.getElementById('particles');
  var colors=['#7c5cbf','#43d9ad','#ffd166','#ff6b6b'];
  for(var i=0;i<14;i++){
    var p=document.createElement('div');p.className='particle';
    var s=Math.random()*70+20;
    p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;background:'+colors[i%4]+';animation-duration:'+(Math.random()*18+14)+'s;animation-delay:'+(Math.random()*-18)+'s;';
    c.appendChild(p);
  }
}

// ─── Helpers ────────────────────────────────────────
function subjectName(s){return{toan:'Toán','tieng-viet':'Tiếng Việt','tieng-anh':'Tiếng Anh'}[s]||s;}
function gradeName(g){return 'Lớp '+g;}
function typeName(t){return{choice:'Trắc nghiệm',fill:'Điền chỗ trống',match:'Nối cột',multi:'Nhiều đáp án'}[t]||t;}
function diffName(d){return{easy:'Dễ',medium:'Trung bình',hard:'Khó'}[d]||d;}
function typeBadge(t){return{choice:'badge-choice',fill:'badge-fill',match:'badge-match',multi:'badge-multi'}[t]||'badge-choice';}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isDeferred(){ return quizMode === 'deferred'; }

// ─── Empty state ─────────────────────────────────────
function renderEmpty(){
  document.getElementById('app').innerHTML='<div class="empty-state"><div class="empty-emoji">📭</div><h2>Chưa có đề thi</h2><p>Vui lòng quay lại trang quản lý để tạo đề thi.</p><a class="go-home" href="index.html">← Về trang quản lý</a></div>';
}

// ─── Render exam ─────────────────────────────────────
function renderExam(){
  var subjects=[...new Set(questions.map(function(q){return q.subject;}))];
  var grades=[...new Set(questions.map(function(q){return q.grade;}))];

  var html='<header class="header">';
  html+='<a class="back-btn" href="index.html">← Quản lý đề</a>';
  html+='<div class="theme-selector"><select class="theme-select" id="quiz-theme-select" onchange="changeTheme(this.value)"><option value="dark">🌙 Dark Theme</option><option value="light">☀️ Light Theme</option><option value="ocean">🌊 Ocean Theme</option><option value="forest">🌲 Forest Theme</option><option value="sunset">🌅 Sunset Theme</option></select></div>';
  html+='<div class="mode-badge '+quizMode+'">'+(isDeferred()?'📋 Chấm khi nộp':'⚡ Chấm tức thì')+'</div>';
  html+='<div class="exam-meta">';
  subjects.forEach(function(s){html+='<span class="meta-badge meta-subject">'+subjectName(s)+'</span>';});
  grades.forEach(function(g){html+='<span class="meta-badge meta-grade">'+gradeName(g)+'</span>';});
  html+='</div>';
  html+='<h1>Bài Kiểm Tra — '+questions.length+' Câu Hỏi</h1>';
  html+='</header>';

  // Score bar differs by mode
  html+='<div class="score-bar">';
  if(isDeferred()){
    html+='<div class="score-card deferred-card"><div class="label">Đã làm</div><div class="value" id="live-done">0/'+questions.length+'</div></div>';
    html+='<div class="score-card deferred-card"><div class="label">Trạng thái</div><div class="value" id="live-status" style="font-size:13px;padding-top:3px">Chưa nộp</div></div>';
  } else {
    html+='<div class="score-card"><div class="label">Điểm</div><div class="value" id="live-score">0</div></div>';
    html+='<div class="score-card"><div class="label">Đã làm</div><div class="value" id="live-done">0/'+questions.length+'</div></div>';
  }
  html+='</div>';

  if(isDeferred()){
    html+='<div class="deferred-banner"><div class="deferred-banner-inner">📋 Chế độ chấm khi nộp — Làm xong tất cả rồi nhấn "Nộp bài" để xem kết quả</div></div>';
  }

  html+='<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div><div class="progress-label" id="progress-label">0 / '+questions.length+' câu</div></div>';
  html+='<main class="quiz-container" id="quiz-container">';
  questions.forEach(function(q,i){ html+=renderCard(q,i+1); });
  html+='</main>';
  html+='<div class="submit-section"><button class="submit-btn" onclick="submitAll()">🎯 Nộp bài &amp; Xem kết quả</button></div>';
  html+='<div class="result-overlay" id="result-overlay"><div class="result-box"><span class="result-emoji" id="result-emoji">🎉</span><div class="result-title" id="result-title"></div><div class="result-score" id="result-score"></div><div class="result-msg" id="result-msg"></div><div class="result-actions"><button class="retry-btn" onclick="location.reload()">🔄 Làm lại</button><button class="review-btn" onclick="closeResult()">👁️ Xem lại bài</button><a class="home-btn" href="index.html">🏠 Trang quản lý</a></div></div></div>';

  document.getElementById('app').innerHTML=html;

  // Restore theme in selector
  var savedTheme = localStorage.getItem('app-theme');
  if(savedTheme){
    var sel=document.getElementById('quiz-theme-select');
    if(sel) sel.value=savedTheme;
  }
}

function renderCard(q,num){
  var h='<div class="q-card" id="qcard-'+q.id+'">';
  h+='<div class="q-header"><div class="q-num">'+num+'</div><span class="q-type-badge '+typeBadge(q.type)+'">'+typeName(q.type)+'</span>';
  if(q.difficulty){h+='<span style="font-size:10px;color:var(--text-muted);margin-left:auto;font-weight:700;">'+diffName(q.difficulty)+'</span>';}
  h+='</div>';
  h+='<div class="q-text">'+escHtml(q.question)+'</div>';
  h+='<div class="q-body">';
  if(q.type==='choice') h+=renderChoice(q);
  else if(q.type==='fill') h+=renderFill(q);
  else if(q.type==='match') h+=renderMatch(q);
  else if(q.type==='multi') h+=renderMulti(q);
  h+='<div class="q-feedback" id="fb-'+q.id+'"></div>';
  h+='</div></div>';
  return h;
}

// ─── Choice ─────────────────────────────────────────
function renderChoice(q){
  var h='<div class="choices">';
  (q.options||[]).forEach(function(opt){
    h+='<button class="choice-btn" id="choice-'+q.id+'-'+opt.val+'" data-qid="'+q.id+'" data-val="'+opt.val+'" data-correct="'+q.answer+'" onclick="selectChoice(this)">';
    h+='<span class="choice-letter">'+escHtml(opt.val)+'</span> '+escHtml(opt.text);
    h+='</button>';
  });
  h+='</div>';
  return h;
}

function selectChoice(btn){
  var qid=btn.dataset.qid, correct=btn.dataset.correct, chosen=btn.dataset.val;
  if(isDeferred()){
    // Deferred: just track selection, allow changing
    if(appState.answered[qid]===true||appState.answered[qid]===false) return; // locked after submit
    var btns=document.querySelectorAll('[data-qid="'+qid+'"].choice-btn');
    btns.forEach(function(b){b.classList.remove('selected-deferred');});
    btn.classList.add('selected-deferred');
    var wasInteracted=!!appState.choiceSelected[qid];
    appState.choiceSelected[qid]=chosen;
    if(!wasInteracted){ trackInteraction(qid); }
  } else {
    // Immediate: grade now
    var btns2=document.querySelectorAll('[data-qid="'+qid+'"].choice-btn');
    for(var i=0;i<btns2.length;i++){if(btns2[i].disabled)return;}
    var ok=chosen===correct;
    btns2.forEach(function(b){
      b.disabled=true;
      if(b.dataset.val===correct) b.classList.add('correct');
      else if(b.dataset.val===chosen&&!ok) b.classList.add('wrong');
    });
    showFeedback('fb-'+qid,ok,ok?'Chính xác! 🎉':'Chưa đúng. Đáp án là <b>'+correct+'</b>.');
    recordAnswer(qid,ok);
  }
}

// ─── Multi ──────────────────────────────────────────
function renderMulti(q){
  var h='<div class="multi-hint">☑️ Có thể chọn nhiều đáp án</div><div class="choices">';
  (q.options||[]).forEach(function(opt){
    h+='<button class="multi-btn" id="multi-'+q.id+'-'+opt.val+'" data-qid="'+q.id+'" data-val="'+opt.val+'" onclick="toggleMulti(this)">';
    h+='<span class="check-box"></span> '+escHtml(opt.text);
    h+='</button>';
  });
  h+='</div>';
  if(!isDeferred()){
    h+='<button class="check-btn" id="check-multi-'+q.id+'" onclick="checkMulti(\''+q.id+'\')">Kiểm tra</button>';
  }
  return h;
}
function toggleMulti(btn){
  var qid=btn.dataset.qid, val=btn.dataset.val;
  if(btn.disabled||appState.answered[qid]!==undefined)return;
  var sel=appState.multiSelected[qid]||(appState.multiSelected[qid]=[]);
  var idx=sel.indexOf(val);
  if(idx===-1){sel.push(val);btn.classList.add('selected');btn.querySelector('.check-box').textContent='✓';}
  else{sel.splice(idx,1);btn.classList.remove('selected');btn.querySelector('.check-box').textContent='';}
  if(isDeferred()&&sel.length>0&&!appState.interacted[qid]) trackInteraction(qid);
}
function checkMulti(qid){
  var q=questions.find(function(x){return x.id===qid;});
  var sel=appState.multiSelected[qid]||[];
  var correct=q.answers||[];
  var btns=document.querySelectorAll('[data-qid="'+qid+'"].multi-btn');
  var ok=sel.length===correct.length&&correct.every(function(v){return sel.indexOf(v)!==-1;});
  btns.forEach(function(b){
    b.disabled=true;
    var v=b.dataset.val, isCorrect=correct.indexOf(v)!==-1, isSelected=sel.indexOf(v)!==-1;
    b.classList.remove('selected');
    if(isCorrect&&isSelected) b.classList.add('correct');
    else if(!isCorrect&&isSelected) b.classList.add('wrong');
    else if(isCorrect&&!isSelected) b.classList.add('missed');
    b.querySelector('.check-box').textContent=isCorrect?'✓':(isSelected?'✗':'');
  });
  var checkBtn=document.getElementById('check-multi-'+qid);
  if(checkBtn)checkBtn.disabled=true;
  showFeedback('fb-'+qid,ok,ok?'Xuất sắc! 🎉':'Chưa đúng. Các đáp án đúng đã được đánh dấu.');
  recordAnswer(qid,ok);
}

// ─── Fill ────────────────────────────────────────────
function renderFill(q){
  var text=escHtml(q.question);
  var idx=0;
  text=text.replace(/\[___\]/g,function(){
    var bid=(q.blanks[idx]||{}).id||'b'+(idx+1);
    idx++;
    return '<input class="fill-input" id="fill-'+q.id+'-'+bid+'" data-qid="'+q.id+'" data-bid="'+bid+'" type="text" maxlength="30" placeholder="?" oninput="onFillInput(this)"/>';
  });
  var h='<div class="fill-sentence">'+text+'</div>';
  if(!isDeferred()){
    h+='<button class="check-btn" id="check-fill-'+q.id+'" onclick="checkFill(\''+q.id+'\')">Kiểm tra</button>';
  }
  return h;
}
function onFillInput(inp){
  if(!isDeferred())return;
  var qid=inp.dataset.qid;
  if(!appState.interacted[qid]) trackInteraction(qid);
}
function checkFill(qid){
  var q=questions.find(function(x){return x.id===qid;});
  var allOk=true;
  (q.blanks||[]).forEach(function(b){
    var inp=document.getElementById('fill-'+qid+'-'+b.id);
    if(!inp)return;
    var ok=inp.value.trim().toLowerCase()===String(b.answer).toLowerCase();
    if(!ok)allOk=false;
    inp.classList.add(ok?'correct':'wrong');
    inp.disabled=true;
  });
  var checkBtn=document.getElementById('check-fill-'+qid);
  if(checkBtn)checkBtn.disabled=true;
  showFeedback('fb-'+qid,allOk,allOk?'Đúng rồi! 🎉':'Có ô chưa đúng.');
  recordAnswer(qid,allOk);
}

// ─── Match ───────────────────────────────────────────
function renderMatch(q){
  var h='<div class="match-hint">💡 Click ô trái → click ô phải để nối. Click lại để huỷ.</div>';
  h+='<div class="match-area" id="match-area-'+q.id+'">';
  h+='<div class="match-col" id="mcol-left-'+q.id+'">';
  (q.leftItems||[]).forEach(function(item){
    h+='<div class="match-item" id="mi-'+q.id+'-'+item.id+'" data-qid="'+q.id+'" data-side="left" data-id="'+item.id+'" onclick="matchClick(this)">'+escHtml(item.text)+'</div>';
  });
  h+='</div>';
  h+='<div class="match-svg-col" id="msvg-col-'+q.id+'"><svg id="msvg-'+q.id+'"></svg></div>';
  h+='<div class="match-col" id="mcol-right-'+q.id+'">';
  (q.rightItems||[]).forEach(function(item){
    h+='<div class="match-item" id="mi-'+q.id+'-'+item.id+'" data-qid="'+q.id+'" data-side="right" data-id="'+item.id+'" onclick="matchClick(this)">'+escHtml(item.text)+'</div>';
  });
  h+='</div></div>';
  if(!isDeferred()){
    h+='<button class="check-btn" id="check-match-'+q.id+'" onclick="checkMatchQ(\''+q.id+'\')" disabled>Kiểm tra</button>';
  }
  return h;
}

var LINE_COLORS=['#7c5cbf','#43d9ad','#ffd166','#ff6b6b'];
function matchClick(el){
  var qid=el.dataset.qid, side=el.dataset.side, id=el.dataset.id;
  var ms=appState.matchState[qid];
  if(!ms||ms.locked)return;
  if(side==='left'){
    var existIdx=ms.pairs.findIndex(function(p){return p.left===id;});
    if(existIdx!==-1){
      var oldRight=ms.pairs[existIdx].right;
      ms.pairs.splice(existIdx,1);
      el.classList.remove('paired','active-left');
      var rEl=document.getElementById('mi-'+qid+'-'+oldRight);
      if(rEl)rEl.classList.remove('paired');
      drawMatchLines(qid);
      if(!isDeferred()){var cb=document.getElementById('check-match-'+qid);if(cb){var q=questions.find(function(x){return x.id===qid;});cb.disabled=ms.pairs.length<(q.leftItems||[]).length;}}
    }
    if(ms.selected===id){el.classList.remove('active-left');ms.selected=null;return;}
    if(ms.selected){var prev=document.getElementById('mi-'+qid+'-'+ms.selected);if(prev)prev.classList.remove('active-left');}
    el.classList.add('active-left');
    ms.selected=id;
  } else {
    if(!ms.selected)return;
    var leftId=ms.selected, rightId=id;
    var existRight=ms.pairs.findIndex(function(p){return p.right===rightId;});
    if(existRight!==-1){
      var oldLeft=ms.pairs[existRight].left;
      ms.pairs.splice(existRight,1);
      var oLEl=document.getElementById('mi-'+qid+'-'+oldLeft);
      if(oLEl)oLEl.classList.remove('paired');
      el.classList.remove('paired');
    }
    ms.pairs=ms.pairs.filter(function(p){return p.left!==leftId;});
    ms.pairs.push({left:leftId,right:rightId});
    var lEl=document.getElementById('mi-'+qid+'-'+leftId);
    if(lEl){lEl.classList.remove('active-left');lEl.classList.add('paired');}
    el.classList.add('paired');
    ms.selected=null;
    drawMatchLines(qid);
    var q=questions.find(function(x){return x.id===qid;});
    var allPaired=ms.pairs.length>=(q.leftItems||[]).length;
    if(!isDeferred()){var cb=document.getElementById('check-match-'+qid);if(cb)cb.disabled=!allPaired;}
    if(isDeferred()&&allPaired&&!appState.interacted[qid]) trackInteraction(qid);
  }
}

function drawMatchLines(qid){
  var svgEl=document.getElementById('msvg-'+qid);
  var svgCol=document.getElementById('msvg-col-'+qid);
  var leftCol=document.getElementById('mcol-left-'+qid);
  var rightCol=document.getElementById('mcol-right-'+qid);
  var ms=appState.matchState[qid];
  svgEl.innerHTML='';
  var svgRect=svgCol.getBoundingClientRect();
  var areaEl=document.getElementById('match-area-'+qid);
  var areaH=areaEl.getBoundingClientRect().height;
  svgEl.setAttribute('height',areaH);
  ms.pairs.forEach(function(pair,i){
    var lEl=leftCol.querySelector('[data-id="'+pair.left+'"]');
    var rEl=rightCol.querySelector('[data-id="'+pair.right+'"]');
    if(!lEl||!rEl)return;
    var lR=lEl.getBoundingClientRect(), rR=rEl.getBoundingClientRect();
    var x1=0,y1=lR.top+lR.height/2-svgRect.top;
    var x2=svgRect.width,y2=rR.top+rR.height/2-svgRect.top;
    var cx1=x1+svgRect.width*.45, cx2=x2-svgRect.width*.45;
    var color=LINE_COLORS[i%LINE_COLORS.length];
    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','M'+x1+','+y1+' C'+cx1+','+y1+' '+cx2+','+y2+' '+x2+','+y2);
    path.setAttribute('stroke',color);path.setAttribute('stroke-width','2.5');
    path.setAttribute('fill','none');path.setAttribute('stroke-linecap','round');
    path.style.filter='drop-shadow(0 0 5px '+color+'aa)';
    path.style.strokeDasharray='300';path.style.strokeDashoffset='300';
    path.style.animation='drawLine .35s ease forwards';
    svgEl.appendChild(path);
  });
}

function checkMatchQ(qid){
  var q=questions.find(function(x){return x.id===qid;});
  var ms=appState.matchState[qid];
  ms.locked=true;
  var checkBtn=document.getElementById('check-match-'+qid);
  if(checkBtn)checkBtn.disabled=true;
  var allOk=ms.pairs.every(function(p){return q.correctPairs[p.left]===p.right;});
  ms.pairs.forEach(function(p){
    var ok=q.correctPairs[p.left]===p.right;
    var cls=ok?'checked-correct':'checked-wrong';
    var lEl=document.getElementById('mi-'+qid+'-'+p.left);
    var rEl=document.getElementById('mi-'+qid+'-'+p.right);
    if(lEl){lEl.classList.remove('paired','active-left');lEl.classList.add(cls);}
    if(rEl){rEl.classList.remove('paired');rEl.classList.add(cls);}
  });
  showFeedback('fb-'+qid,allOk,allOk?'Tuyệt vời! Nối đúng tất cả! 🎉':'Một số cặp chưa đúng.');
  recordAnswer(qid,allOk);
}

// ─── Deferred: track interactions ────────────────────
function trackInteraction(qid){
  appState.interacted[qid]=true;
  var count=Object.keys(appState.interacted).length;
  var total=questions.length;
  var pct=(count/total)*100;
  document.getElementById('live-done').textContent=count+'/'+total;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-label').textContent=count+' / '+total+' câu';
  var statusEl=document.getElementById('live-status');
  if(statusEl)statusEl.textContent=count>=total?'Sẵn sàng nộp':'Đang làm';
}

// ─── Feedback & Score ─────────────────────────────────
function showFeedback(id,ok,msg){
  var el=document.getElementById(id);
  if(!el)return;
  el.className='q-feedback show '+(ok?'correct-fb':'wrong-fb');
  el.innerHTML=(ok?'✅ ':'❌ ')+msg;
}

function recordAnswer(qid,ok){
  if(appState.answered[qid]!==undefined)return;
  appState.answered[qid]=ok;
  appState.done++;
  if(ok)appState.score++;
  if(!isDeferred()){
    var scoreEl=document.getElementById('live-score');
    if(scoreEl)scoreEl.textContent=appState.score;
    document.getElementById('live-done').textContent=appState.done+'/'+questions.length;
    var pct=(appState.done/questions.length)*100;
    document.getElementById('progress-fill').style.width=pct+'%';
    document.getElementById('progress-label').textContent=appState.done+' / '+questions.length+' câu';
  }
}

// ─── Submit ───────────────────────────────────────────
function submitAll(){
  questions.forEach(function(q){
    if(isDeferred()){
      // Grade all in deferred mode
      if(q.type==='choice'){
        var chosen=appState.choiceSelected[q.id];
        var btns=document.querySelectorAll('[data-qid="'+q.id+'"].choice-btn');
        var ok=chosen===q.answer;
        btns.forEach(function(b){
          b.disabled=true;
          b.classList.remove('selected-deferred');
          if(b.dataset.val===q.answer) b.classList.add('correct');
          else if(b.dataset.val===chosen&&!ok) b.classList.add('wrong');
        });
        showFeedback('fb-'+q.id,ok,ok?'Chính xác! 🎉':(chosen?'Chưa đúng. Đáp án là <b>'+q.answer+'</b>.':'Chưa chọn đáp án. Đáp án đúng: <b>'+q.answer+'</b>.'));
        recordAnswer(q.id,ok);
      } else if(q.type==='fill'){
        checkFill(q.id);
      } else if(q.type==='match'){
        var ms=appState.matchState[q.id];
        ms.locked=true;
        if(ms.pairs.length<(q.leftItems||[]).length){
          showFeedback('fb-'+q.id,false,'Câu chưa hoàn thành.');
          recordAnswer(q.id,false);
        } else { checkMatchQ(q.id); }
      } else if(q.type==='multi'){
        checkMulti(q.id);
      }
    } else {
      // Immediate mode: handle unanswered
      if(appState.answered[q.id]!==undefined)return;
      if(q.type==='choice'){
        var btns2=document.querySelectorAll('[data-qid="'+q.id+'"].choice-btn');
        btns2.forEach(function(b){b.disabled=true;if(b.dataset.val===q.answer)b.classList.add('correct');});
        showFeedback('fb-'+q.id,false,'Câu chưa trả lời. Đáp án đúng đã hiển thị.');
        recordAnswer(q.id,false);
      } else if(q.type==='fill'){ checkFill(q.id); }
      else if(q.type==='match'){
        var ms2=appState.matchState[q.id];ms2.locked=true;
        document.querySelectorAll('[data-qid="'+q.id+'"]').forEach(function(el){el.style.pointerEvents='none';});
        if(ms2.pairs.length<(q.leftItems||[]).length){showFeedback('fb-'+q.id,false,'Câu chưa hoàn thành.');recordAnswer(q.id,false);}
        else checkMatchQ(q.id);
      } else if(q.type==='multi'){ checkMulti(q.id); }
    }
  });
  setTimeout(showResult,350);
}

// ─── Result ───────────────────────────────────────────
function showResult(){
  var s=appState.score, total=questions.length;
  var pct=s/total;
  var data=pct===1?{emoji:'🏆',title:'Hoàn hảo!',msg:'Em làm đúng tất cả các câu! Xuất sắc! 🌟'}
    :pct>=.8?{emoji:'🎉',title:'Rất giỏi!',msg:'Em làm bài rất tốt! Cố gắng lên nhé! ⭐'}
    :pct>=.6?{emoji:'😊',title:'Khá tốt!',msg:'Em cần ôn luyện thêm một chút! 📚'}
    :pct>=.4?{emoji:'😅',title:'Cần cố gắng!',msg:'Em cần ôn tập lại bài học nhé! 💪'}
    :{emoji:'😢',title:'Cần ôn luyện thêm!',msg:'Đừng nản lòng! Hãy ôn lại và thử tiếp nhé! 📖'};
  document.getElementById('result-emoji').textContent=data.emoji;
  document.getElementById('result-title').textContent=data.title;
  document.getElementById('result-score').textContent=s+'/'+total;
  document.getElementById('result-msg').textContent=data.msg;
  document.getElementById('result-overlay').classList.add('show');
}

function closeResult() {
  document.getElementById('result-overlay').classList.remove('show');
}

window.addEventListener('resize',function(){
  questions.forEach(function(q){
    if(q.type==='match'&&appState.matchState[q.id]&&appState.matchState[q.id].pairs.length>0) drawMatchLines(q.id);
  });
});

// Theme handling
function changeTheme(theme){
  document.body.setAttribute('data-theme', theme);
  localStorage.setItem('app-theme', theme);
}
var initTheme=localStorage.getItem('app-theme');
if(initTheme){ document.body.setAttribute('data-theme', initTheme); }

</script>
